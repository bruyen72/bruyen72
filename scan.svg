  <circle class="pulso" cx="26" cy="30" r="4" fill="#FFC24D"/>
  <text class="t" x="42" y="34" fill="#FFC24D">SEGURANÇA OFENSIVA · ESCOPO AUTORIZADO</text>

  <text xml:space="preserve" class="m" x="30" y="72" fill="#FFC24D">$</text>
  <text xml:space="preserve" class="m" x="48" y="72" fill="#EEF2F8">nmap -sV -Pn --top-ports 200 alvo.autorizado.br</text>

  <text class="t" x="30"  y="98" fill="#5A6273">PORT</text>
  <text class="t" x="140" y="98" fill="#5A6273">STATE</text>
  <text class="t" x="235" y="98" fill="#5A6273">SERVICE</text>
  <text class="t" x="360" y="98" fill="#5A6273">VERSION</text>
  <line x1="30" y1="105" x2="810" y2="105" stroke="#2B3140"/>

  <!-- feixe descendo pela tabela -->
  <g class="feixe">
    <rect x="18" y="104" width="804" height="30" fill="url(#fx)"/>
    <line x1="18" y1="133" x2="822" y2="133" stroke="#FFC24D" stroke-width="1.2" opacity=".8"/>
  </g>

  <g class="p0">
    <text xml:space="preserve" class="m" x="30"  y="118" fill="#8992A3">22/tcp</text>
    <text xml:space="preserve" class="m" x="140" y="118" fill="#4FD8E8">open</text>
    <text xml:space="preserve" class="m" x="235" y="118" fill="#B2BBCB">ssh</text>
    <text xml:space="preserve" class="m" x="360" y="118" fill="#8992A3">OpenSSH 9.6</text>
    
  </g>
  <g class="p1">
    <text xml:space="preserve" class="m" x="30"  y="144" fill="#8992A3">80/tcp</text>
    <text xml:space="preserve" class="m" x="140" y="144" fill="#4FD8E8">open</text>
    <text xml:space="preserve" class="m" x="235" y="144" fill="#B2BBCB">http</text>
    <text xml:space="preserve" class="m" x="360" y="144" fill="#8992A3">nginx 1.24</text>
    
  </g>
  <g class="p2">
    <text xml:space="preserve" class="m" x="30"  y="170" fill="#8992A3">443/tcp</text>
    <text xml:space="preserve" class="m" x="140" y="170" fill="#4FD8E8">open</text>
    <text xml:space="preserve" class="m" x="235" y="170" fill="#B2BBCB">ssl/http</text>
    <text xml:space="preserve" class="m" x="360" y="170" fill="#8992A3">nginx 1.24</text>
    
  </g>
  <g class="p3">
