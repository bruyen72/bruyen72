    <text xml:space="preserve" class="m" x="140" y="196" fill="#5A6273">closed</text>
    <text xml:space="preserve" class="m" x="235" y="196" fill="#B2BBCB">mysql</text>
    <text xml:space="preserve" class="m" x="360" y="196" fill="#8992A3">—</text>
    
  </g>
  <g class="p4">
    <text xml:space="preserve" class="m" x="30"  y="222" fill="#8992A3">5432/tcp</text>
    <text xml:space="preserve" class="m" x="140" y="222" fill="#FF5C79">open</text>
    <text xml:space="preserve" class="m" x="235" y="222" fill="#B2BBCB">postgres</text>
    <text xml:space="preserve" class="m" x="360" y="222" fill="#8992A3">PostgreSQL 15</text>
    <text xml:space="preserve" class="m" x="560" y="222" fill="#FF5C79">&#160;&lt;--&#160;exposto</text>
  </g>
  <g class="p5">
    <text xml:space="preserve" class="m" x="30"  y="248" fill="#8992A3">8080/tcp</text>
    <text xml:space="preserve" class="m" x="140" y="248" fill="#5A6273">closed</text>
    <text xml:space="preserve" class="m" x="235" y="248" fill="#B2BBCB">http-alt</text>
    <text xml:space="preserve" class="m" x="360" y="248" fill="#8992A3">—</text>
    
  </g>

  <g class="alerta">
    <rect x="30" y="270" width="780" height="30" rx="4" fill="#FF5C79" fill-opacity=".09"/>
    <rect x="30" y="270" width="2.5" height="30" fill="#FF5C79"/>
    <text xml:space="preserve" class="m" x="46" y="290" fill="#FF8A9F">[&#160;!!&#160;] OWASP A05 · banco acessível pela internet aberta</text>
  </g>

  <g class="fix">
    <text xml:space="preserve" class="m" x="30" y="324" fill="#FFC24D">$</text>
    <text xml:space="preserve" class="m" x="48" y="324" fill="#B2BBCB">ufw deny 5432/tcp &amp;&amp; systemctl reload ssh</text>
    <text xml:space="preserve" class="m" x="30" y="346" fill="#4FD8E8">[&#160;ok&#160;]</text>
    <text xml:space="preserve" class="m" x="88" y="346" fill="#B2BBCB">porta fechada · root desativado · reteste agendado</text>
  </g>
</g>
</svg>