  @keyframes feixe{0%{transform:translateY(0);opacity:0}8%{opacity:1}
                   62%{transform:translateY(160px);opacity:1}
                   72%,100%{transform:translateY(160px);opacity:0}}
  .pulso{animation:pulso 1.6s ease-in-out infinite}
  @keyframes pulso{0%,100%{opacity:.35}50%{opacity:1}}
</style>
