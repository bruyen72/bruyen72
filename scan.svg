  .t{font-family:'IBM Plex Mono','DejaVu Sans Mono',Consolas,monospace;font-size:11px;letter-spacing:1.8px}
  .p0{animation:p0 9.0s linear infinite}@keyframes p0{0%,15.6%{opacity:0}16.2%,94%{opacity:1}95%,100%{opacity:0}}.p1{animation:p1 9.0s linear infinite}@keyframes p1{0%,21.7%{opacity:0}22.3%,94%{opacity:1}95%,100%{opacity:0}}.p2{animation:p2 9.0s linear infinite}@keyframes p2{0%,27.8%{opacity:0}28.4%,94%{opacity:1}95%,100%{opacity:0}}.p3{animation:p3 9.0s linear infinite}@keyframes p3{0%,33.9%{opacity:0}34.5%,94%{opacity:1}95%,100%{opacity:0}}.p4{animation:p4 9.0s linear infinite}@keyframes p4{0%,40.0%{opacity:0}40.6%,94%{opacity:1}95%,100%{opacity:0}}.p5{animation:p5 9.0s linear infinite}@keyframes p5{0%,46.1%{opacity:0}46.7%,94%{opacity:1}95%,100%{opacity:0}}.alerta{animation:al 9.0s linear infinite}@keyframes al{0%,62.2%{opacity:0}62.8%,94%{opacity:1}95%,100%{opacity:0}}.fix{animation:fx 9.0s linear infinite}@keyframes fx{0%,73.3%{opacity:0}73.9%,94%{opacity:1}95%,100%{opacity:0}}
